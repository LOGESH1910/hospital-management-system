<?xml version="1.0" encoding="UTF-8"?>
<!-- MediCare Pro Logo Mark -->
<svg width="48" height="48" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Abstract medical cross + heart symbol -->
  <g fill="none" stroke="url(#grad1)" stroke-width="2" stroke-linecap="round">
    <!-- Vertical bar of cross -->
    <line x1="24" y1="12" x2="24" y2="36" />
    <!-- Horizontal bar of cross -->
    <line x1="12" y1="24" x2="36" y2="24" />
    <!-- Heart shape using arcs and triangle -->
    <path d="M24 2a22 22 0 1 1 0 44A22 22 0 0 1 24 2Z" opacity="0.3" />
  </g>
  <!-- Center dot -->
  <circle cx="24" cy="24" r="4" fill="url(#grad1)" />
  
  <!-- Wordmark: "MediCare" -->
  <text x="24" y="42" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#0f172a" text-anchor="middle">MediCare</text>
  <text x="24" y="48" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#0f172a" text-anchor="middle">Pro</text>
</svg>